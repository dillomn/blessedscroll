<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BlessedScroll</title>
<style>
  :root {
    --bg: #0b0d10;
    --text: #eceef3;
    --muted: #a3abba;
    --accent: #8fd6b4;
    --like: #ff6b9a;
    --glass: rgba(22, 25, 32, 0.55);
    --glass-border: rgba(255, 255, 255, 0.08);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }

  .stage { position: absolute; inset: 0; background: #000; touch-action: pan-x pinch-zoom; }
  .stage video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
    opacity: 0; transition: opacity .18s ease;
  }
  .stage video.active { opacity: 1; }

  /* top bar */
  .top {
    position: absolute; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) 28px calc(var(--safe-l) + 16px);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { font-weight: 700; letter-spacing: .3px; font-size: 17px; }
  .brand span { color: var(--accent); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px; color: var(--text); text-decoration: none;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 14px; font-weight: 600;
  }
  .pill svg { width: 16px; height: 16px; color: var(--like); }

  /* bottom info */
  .info {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    padding: 60px calc(var(--safe-r) + 88px) calc(var(--safe-b) + 22px) calc(var(--safe-l) + 16px);
    background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.35) 60%, transparent);
    pointer-events: none;
  }
  .info > * { pointer-events: auto; }
  .who { font-weight: 650; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .who .date { color: var(--muted); font-weight: 400; font-size: 13px; }
  .caption {
    margin-top: 6px; font-size: 14.5px; color: #dfe3ea; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer; max-width: 640px;
  }
  .caption.open { -webkit-line-clamp: unset; max-height: 40vh; overflow-y: auto; }
  .stats { margin-top: 8px; color: var(--muted); font-size: 13px; display: flex; gap: 14px; }

  /* action rail */
  .rail {
    position: absolute; z-index: 6;
    right: calc(var(--safe-r) + 12px); bottom: calc(var(--safe-b) + 22px);
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  .act {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: 0; padding: 0; color: var(--text); cursor: pointer;
    font: inherit; font-size: 11.5px; font-weight: 600; text-decoration: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .act .ic {
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform .12s ease, background .15s;
  }
  .act:active .ic { transform: scale(.9); }
  .act svg { width: 24px; height: 24px; }
  .act.liked .ic { background: rgba(255,107,154,.22); border-color: rgba(255,107,154,.5); }
  .act.liked svg { color: var(--like); fill: var(--like); }
  .act.next .ic { background: rgba(143,214,180,.2); border-color: rgba(143,214,180,.45); }
  .act.busy { opacity: .55; pointer-events: none; }
  @media (hover: hover) { .act:hover .ic { background: rgba(40,44,54,.75); } }

  /* progress */
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 7; background: rgba(255,255,255,.1); }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* centre states */
  .center {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    pointer-events: none; text-align: center; padding: 24px;
  }
  .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
    animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center p { margin: 0; color: var(--muted); font-size: 14px; }
  .bigicon {
    width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,.45);
    display: grid; place-items: center;
  }
  .bigicon svg { width: 34px; height: 34px; }
  .heart-pop svg { width: 96px; height: 96px; color: var(--like); fill: var(--like);
    filter: drop-shadow(0 4px 18px rgba(0,0,0,.5)); animation: pop .7s ease forwards; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 25% { transform: scale(1.15); opacity: 1 }
    60% { transform: scale(1); opacity: 1 } 100% { transform: scale(1); opacity: 0 } }

  .toast {
    position: absolute; z-index: 9; left: 50%; transform: translateX(-50%);
    top: calc(var(--safe-t) + 64px); max-width: min(92vw, 420px);
    background: rgba(28, 31, 40, .92); border: 1px solid var(--glass-border);
    padding: 10px 14px; border-radius: 12px; font-size: 13.5px; text-align: center;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .keys { display: none; }
  @media (hover: hover) and (min-width: 900px) {
    .keys { display: block; position: absolute; z-index: 5; left: calc(var(--safe-l) + 16px);
      top: calc(var(--safe-t) + 52px); color: var(--muted); font-size: 12px; }
    .keys b { color: var(--text); font-weight: 600; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <video playsinline muted loop preload="auto"></video>
    <video playsinline muted loop preload="auto"></video>
  </div>

  <div class="center" id="loader"><div><div class="spinner"></div><p id="loader-msg">Finding a video…</p></div></div>
  <div class="center" id="paused" hidden><div class="bigicon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>
  <div class="center heart-pop" id="heart" hidden><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>

  <header class="top">
    <div class="brand">Blessed<span>Scroll</span></div>
    <a class="pill" href="/likes"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg><span id="like-count">Likes</span></a>
  </header>
  <div class="keys"><b>R</b>/<b>→</b> next · <b>Space</b> pause · <b>L</b> like · <b>D</b> save · <b>M</b> sound</div>

  <section class="info" id="info" hidden>
    <div class="who"><span id="user"></span><span class="date" id="date"></span></div>
    <div class="caption" id="caption"></div>
    <div class="stats" id="stats"></div>
  </section>

  <nav class="rail">
    <button class="act" id="btn-like" aria-label="Super like">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></span>
      <span id="like-label">Like</span>
    </button>
    <a class="act" id="btn-dl" aria-label="Save video" href="#">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></span>
      <span id="save-label">Save</span>
    </a>
    <button class="act" id="btn-sound" aria-label="Toggle sound">
      <span class="ic" id="sound-ic"></span>
      <span id="sound-label">Sound</span>
    </button>
    <a class="act" id="btn-open" aria-label="Open on X" href="#" target="_blank" rel="noopener noreferrer">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span>
      <span>Open</span>
    </a>
    <button class="act next" id="btn-next" aria-label="Next video">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></span>
      <span>Next</span>
    </button>
  </nav>

  <div class="progress"><i id="bar"></i></div>
  <div class="toast" id="toast" hidden></div>

<script src="/save.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const vids = [...document.querySelectorAll('.stage video')];
  const ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6m0-6 6 6"/></svg>';
  const ICON_SOUND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  let cur = 0;               // index of the active <video>
  let current = null;        // record being shown
  let upcoming = null;       // { rec, ready: Promise<boolean> } preloaded in the other <video>
  let muted = true;
  let liked = new Set();
  const likedUrls = new Map();
  let busy = false;
  let watchdog = null;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---------- helpers
  const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n || 0);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let toastTimer;
  function toast(msg, ms = 2600) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms);
  }
  function loader(msg) {
    if (msg === false) { $('loader').hidden = true; return; }
    $('loader-msg').textContent = msg; $('loader').hidden = false;
  }
  function tid(url) { const m = /\/status\/(\d+)/.exec(url || ''); return m && m[1]; }

  async function fetchRandom() {
    for (let attempt = 0; ; attempt++) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 30000);
      try {
        const r = await fetch('/random', { signal: ctl.signal, cache: 'no-store' });
        if (r.ok) return await r.json();
      } catch {}
      finally { clearTimeout(t); }
      if (attempt >= 1 && !current) loader('Still looking — the archive lookup is slow right now…');
      await sleep(Math.min(1000 * 2 ** attempt, 8000));
    }
  }

  // Load rec into a <video>; resolves true when it can play, false on error/timeout.
  function loadInto(v, rec, timeoutMs = 15000) {
    return new Promise(resolve => {
      let done = false;
      const finish = ok => {
        if (done) return; done = true;
        v.removeEventListener('canplay', onOk); v.removeEventListener('loadeddata', onOk);
        v.removeEventListener('error', onErr); clearTimeout(t); resolve(ok);
      };
      const onOk = () => finish(true), onErr = () => finish(false);
      v.addEventListener('canplay', onOk); v.addEventListener('loadeddata', onOk);
      v.addEventListener('error', onErr);
      const t = setTimeout(() => finish(false), timeoutMs);
      v.poster = rec.thumb || '';
      v.src = rec.video;
      v.load();
    });
  }

  function prepareNext() {
    if (upcoming) return;
    const v = vids[1 - cur];
    const slot = { rec: null };
    slot.ready = (async () => {
      for (let i = 0; i < 5; i++) {
        const rec = await fetchRandom();
        if (upcoming !== slot) return false;
        slot.rec = rec;
        if (await loadInto(v, rec)) return true;
      }
      return false;
    })();
    upcoming = slot;
  }

  // ---------- rendering
  function render(rec) {
    current = rec;
    $('info').hidden = false;
    $('user').textContent = rec.name ? `${rec.name}  @${rec.user}` : '@' + (rec.user || 'unknown');
    $('date').textContent = rec.date ? new Date(rec.date * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
    const cap = (rec.text || '').replace(/\s*https:\/\/t\.co\/\w+\s*$/, '').trim();
    $('caption').textContent = cap;
    $('caption').hidden = !cap;
    $('caption').classList.remove('open');
    $('stats').textContent = '';
    for (const [k, n] of [['♥', rec.likes], ['⟲', rec.retweets], ['💬', rec.replies]]) {
      const s = document.createElement('span'); s.textContent = `${k} ${fmt(n)}`; $('stats').append(s);
    }
    $('btn-dl').href = '/dl/' + rec.id;
    $('save-label').textContent = 'Save';
    $('btn-open').href = rec.url || ('https://x.com/i/status/' + rec.id);
    renderLike();
  }
  function renderLike() {
    const on = current && liked.has(current.id);
    $('btn-like').classList.toggle('liked', !!on);
    $('like-label').textContent = on ? 'Liked' : 'Like';
    $('like-count').textContent = liked.size ? `${liked.size}` : 'Likes';
  }
  function renderSound() {
    $('sound-ic').innerHTML = muted ? ICON_MUTED : ICON_SOUND;
    $('sound-label').textContent = muted ? 'Muted' : 'Sound';
  }

  // ---------- playback
  function playActive() {
    const v = vids[cur];
    v.muted = muted;
    const p = v.play();
    if (p) p.catch(() => {
      // Unmuted autoplay blocked (no user gesture) → fall back to muted.
      if (!v.muted) { muted = true; v.muted = true; renderSound(); v.play().catch(() => {}); }
    });
    $('paused').hidden = true;
    clearTimeout(watchdog);
    watchdog = setTimeout(() => {
      if (v.readyState < 3 && !v.paused) { toast('That one stalled — skipping'); next(); }
    }, 12000);
  }

  function show(index, rec) {
    const old = vids[cur];
    cur = index;
    const v = vids[cur];
    v.classList.add('active');
    old.classList.remove('active');
    old.pause();
    render(rec);
    loader(false);
    playActive();
    // release the old element and preload the following video into it
    old.removeAttribute('src'); old.removeAttribute('poster'); old.load();
    upcoming = null;
    prepareNext();
  }

  async function next() {
    if (busy) return;
    const slot = upcoming;
    // fast path: next video is already buffered → swap synchronously (keeps the
    // user-gesture so iOS lets it play with sound)
    if (slot && slot.rec && vids[1 - cur].readyState >= 2) {
      show(1 - cur, slot.rec);
      return;
    }
    busy = true;
    $('btn-next').classList.add('busy');
    vids[cur].pause();
    loader('Finding a video…');
    try {
      prepareNext();
      let ok = await upcoming.ready;
      while (!ok) {           // 5 broken videos in a row: start a fresh attempt
        upcoming = null; prepareNext(); ok = await upcoming.ready;
      }
      show(1 - cur, upcoming.rec);
    } finally {
      busy = false;
      $('btn-next').classList.remove('busy');
    }
  }

  vids.forEach((v, i) => {
    v.addEventListener('error', () => {
      if (i === cur && current) { toast('Video unavailable — skipping'); next(); }
    });
    v.addEventListener('timeupdate', () => {
      if (i === cur && v.duration) $('bar').style.width = (100 * v.currentTime / v.duration) + '%';
    });
    v.addEventListener('playing', () => { if (i === cur) clearTimeout(watchdog); });
  });

  // ---------- actions
  function setMuted(m) {
    muted = m; vids[cur].muted = m; renderSound();
    if (!m && vids[cur].paused) playActive();
  }
  function togglePause() {
    const v = vids[cur];
    if (!current) return;
    if (v.paused) { playActive(); } else { v.pause(); $('paused').hidden = false; }
  }
  function heartPop() {
    const h = $('heart'); h.hidden = true; void h.offsetWidth; h.hidden = false;
    setTimeout(() => h.hidden = true, 700);
  }
  async function toggleLike(forceOn) {
    if (!current) return;
    const id = current.id;
    const url = likedUrls.get(id) || current.url || `https://twitter.com/i/status/${id}`;
    const on = !liked.has(id);
    if (forceOn && !on) { heartPop(); return; }
    on ? liked.add(id) : liked.delete(id);
    if (on) heartPop();
    renderLike();
    try {
      const r = await fetch('/superlike', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: on ? 'add' : 'remove', url }) });
      if (!r.ok) throw 0;
      on ? likedUrls.set(id, url) : likedUrls.delete(id);
    } catch {
      on ? liked.delete(id) : liked.add(id); renderLike(); toast('Couldn\'t save that like');
    }
  }
  $('btn-like').onclick = () => toggleLike();
  $('btn-next').onclick = () => next();
  $('btn-sound').onclick = () => setMuted(!muted);
  $('caption').onclick = e => { e.stopPropagation(); $('caption').classList.toggle('open'); };
  $('btn-dl').addEventListener('click', e => {
    if (!current) { e.preventDefault(); return; }
    const rec = current;
    BSSave.onClick(e, { id: rec.id, user: rec.user, toast,
      setLabel: t => { if (current === rec) $('save-label').textContent = t || 'Save'; } });
  });

  // tap = pause/play, double tap = like, swipe up = next
  let lastTap = 0, tapTimer = null, touchY = null, touchT = 0;
  const stage = $('stage');
  stage.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; touchT = Date.now(); }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (touchY == null) return;
    const dy = touchY - e.changedTouches[0].clientY; touchY = null;
    if (dy > 60 && Date.now() - touchT < 600) { e.preventDefault(); clearTimeout(tapTimer); next(); }
  });
  stage.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 280) { clearTimeout(tapTimer); lastTap = 0; toggleLike(true); return; }
    lastTap = now;
    tapTimer = setTimeout(togglePause, 280);
  });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'r' || k === 'arrowright' || k === 'arrowdown' || k === 'n') { e.preventDefault(); next(); }
    else if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k === 'l') toggleLike();
    else if (k === 'm') setMuted(!muted);
    else if (k === 'd' && current) $('btn-dl').click();
  });

  // ---------- boot
  renderSound();
  fetch('/get_likes').then(r => r.json()).then(urls => {
    for (const u of urls) { const id = tid(u); if (id) { liked.add(id); likedUrls.set(id, u); } }
    renderLike();
  }).catch(() => {});
  next().then(() => { if (muted) toast('Tap Muted to turn sound on', 2200); });
})();
</script>
</body>
</html>
